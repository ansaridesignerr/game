<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Badshah Wazeer Sipahi Chor</title>
<style>
:root{color-scheme:dark;--p:#5B2C83;--g:#FFC857;--c:#FFF4D6;--r:#FF6B6B;--t:#35C9C8;--d:#241638;box-sizing:border-box;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
*{box-sizing:inherit}body{margin:0;min-height:100vh;font-family:"Trebuchet MS",system-ui,sans-serif;background:var(--d) radial-gradient(circle at 50% 0,var(--p),var(--d));color:var(--c);overflow-x:hidden}
.w{min-height:100vh;padding:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center}
h1{font-size:clamp(1.8rem,6vw,3.2rem);color:var(--g);margin:0;text-shadow:0 4px 0 var(--d)}.row{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
button{font:inherit;cursor:pointer}.b{background:var(--g);color:var(--d);border:0;border-radius:99px;padding:11px 22px;font-weight:700;box-shadow:0 4px 0 #c18f1d;min-height:44px}.b.a{background:var(--t);box-shadow:0 4px 0 #1e8a89}.b:disabled{opacity:.4}
.l{background:none;border:0;color:var(--c);font-size:1.2rem}input{padding:12px;border-radius:12px;border:2px solid var(--g);background:var(--c);color:var(--d);font-size:1rem;width:100%}
.k{background:#fff2;border:2px solid var(--g);border-radius:20px;padding:14px;display:flex;flex-direction:column;gap:10px;width:min(420px,92vw)}.k.big{width:min(560px,94vw);max-height:90vh;overflow:auto}
.av{font-size:1.6rem;background:none;border:2px solid transparent;border-radius:12px}.av.s{border-color:var(--g);background:#ffc85733}
.e{background:var(--r);color:#fff;padding:8px 14px;border-radius:12px}.code{font-size:2.2rem;letter-spacing:.3em;background:var(--c);color:var(--d);padding:6px 16px;border-radius:14px;font-weight:900}
.lob{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:min(420px,92vw)}
.st{background:#fff2;border:3px solid var(--g);border-radius:20px;padding:8px;display:flex;flex-direction:column;align-items:center;position:relative;min-height:100px;justify-content:center;animation:pop .4s}
.st.em{border-style:dashed;opacity:.6}.st.me{border-color:var(--t)}.st.off{opacity:.5}.st.gl{box-shadow:0 0 24px 6px var(--g)}.st .f{font-size:2.3rem}.st small{font-size:.75rem}
.cr{position:absolute;top:-18px;font-size:1.5rem;animation:bn 1s infinite}.rx{position:absolute;top:-30px;background:var(--c);color:var(--d);padding:3px 10px;border-radius:12px;font-size:.8rem;font-weight:700;animation:fl 2.5s forwards;z-index:5;white-space:nowrap}

header{grid-area:h;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}footer{grid-area:f;display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.bd{grid-area:b;display:grid;grid-template-columns:1fr 1fr;grid-template-areas:"a b" "m m" "c d";gap:10px;background:linear-gradient(135deg,#7a3fa8,#3b1d5a);border:4px solid var(--g);border-radius:28px;padding:18px 12px;align-content:space-between}
.s0{grid-area:a}.s1{grid-area:b}.s2{grid-area:c}.s3{grid-area:d}.m{grid-area:m;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.sp{background:var(--c);color:var(--d);padding:10px 16px;border-radius:18px;font-weight:700}.cs{display:flex;gap:10px}
.pc{width:clamp(56px,16vw,90px);aspect-ratio:3/4;font-size:2rem;background:var(--g);border:3px solid #c18f1d;border-radius:12px;color:var(--d);transition:transform .2s}.pc:not(:disabled):hover{transform:translateY(-8px) rotate(-3deg)}.pc.t{opacity:.5}
.sh .pc{animation:sf .5s infinite alternate}.sh .pc:nth-child(even){animation-direction:alternate-reverse}
.rv{padding:10px 14px;border-radius:16px;background:var(--d);border:2px solid var(--g);animation:pop .5s;max-width:360px}.rv.CHOR{border-color:var(--r)}

.lb{grid-area:s;background:#0004;border-radius:16px;padding:12px}.lb h3{margin:0 0 8px;color:var(--g)}.lr{display:grid;grid-template-columns:1fr auto;margin-bottom:8px}.br{grid-column:1/3;height:6px;background:#0006;border-radius:4px;overflow:hidden}.br i{display:block;height:100%;background:var(--g);transition:width 1s}
.ov{position:fixed;inset:0;background:#241638e6;display:grid;place-items:center;z-index:30;padding:8px}table{width:100%;border-collapse:collapse}td,th{padding:6px;border-bottom:1px solid #fff3;text-align:left}
.lbt{display:none}
@keyframes pop{from{transform:scale(.5);opacity:0}to{transform:scale(1);opacity:1}}@keyframes bn{50%{transform:translateY(-6px)}}@keyframes fl{to{transform:translateY(-24px);opacity:0}}@keyframes sf{from{transform:translateX(-14px) rotate(-8deg)}to{transform:translateX(14px) rotate(8deg)}}
@media(max-width:760px){.g{grid-template-columns:1fr;grid-template-areas:"h" "b" "f"}.lbt{display:inline}.lb{display:none;position:fixed;inset:60px 10px auto;z-index:15;background:var(--d)}.lb.o{display:block}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body><div id="app"></div><script>
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const AV=["🦁","🐯","🐵","🦊","🐸","🐼","🦄","🐙"],IC={BADSHAH:"👑",WAZEER:"🧐",SIPAHI:"💂",CHOR:"🥷"},PT={BADSHAH:1000,WAZEER:500,SIPAHI:200,CHOR:0};
const RV={BADSHAH:["Badshahat Mubarak Ho!","Ab hukam chalao, Maharaj!"],WAZEER:["Wazeer Sahab, dimagh lagao!","Chor ko pehchanna aap ki zimmedari hai!"],SIPAHI:["Sipahi hazir hai!","Aaj dekhte hain kis par ilzaam lagta hai!"],CHOR:["Oho! Tum Chor niklay!","Ab bach kar rehna!"]};
const RX=["Hahaha!","Oye Chor!","Jee Hazoor!","Main Masoom Hoon!","Wazeer Sahab Socho!","Badshah Salamat!","Pakro Pakro!"];
const hex=()=>[...crypto.getRandomValues(new Uint8Array(4))].map(b=>b.toString(16).padStart(2,"0")).join("");
const rnd=n=>crypto.getRandomValues(new Uint32Array(1))[0]%n;
const shuf=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a};
const clean=(s,n)=>typeof s==="string"?s.trim().replace(/\s+/g," ").slice(0,n):"";
const $=s=>document.querySelector(s),app=$("#app");
let me={id:hex(),name:"",av:AV[0]},F={mode:"",code:""},err="",pub=null,S=null,room=null,R=null,prooms={},myRole=null,myRR=0,isHost=false,pend=null,rx={},mute=false,lbo=false,lastPh="",ac;
function beep(f=440,d=.15){if(mute)return;try{ac=ac||new AudioContext();const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=f;g.gain.value=.08;o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+d)}catch{}}
const showErr=m=>{err=m;draw();setTimeout(()=>{err="";draw()},3500)};

/* ---------- HOST = authoritative game server (runs in the host's browser) ---------- */
function newS(code){return{code,hostId:me.id,phase:"LOBBY",round:0,players:[],roles:{},cardRoles:[],cards:[null,null,null,null],guess:null,delta:{},settled:false,winners:[],nextAt:0}}
function pubState(){const over=S.phase==="ROUND_RESULTS"||S.phase==="GAME_OVER",open=over||S.phase==="CHOR_GUESS";
 return{code:S.code,hostId:S.hostId,phase:S.phase,round:S.round,nextAt:S.nextAt,
 players:S.players.map(p=>{const r=S.roles[p.id];return{id:p.id,name:p.name,av:p.av,score:p.score,on:p.id===me.id||Date.now()-p.seen<9000,picked:S.cards.includes(p.id),role:r&&(over||(open&&(r==="BADSHAH"||r==="WAZEER")))?r:undefined}}),
 cards:S.cards.map(o=>!!o),result:over&&S.guess?{ok:S.guess.ok,d:S.delta}:undefined,winners:S.phase==="GAME_OVER"?S.winners:undefined}}
function bcast(){pub=pubState();room.emit("state",pub);S.players.forEach(sendPriv);draw()}
function sendPriv(p){const r=S.roles[p.id];if(!r)return;if(p.id===me.id){myRole=r;myRR=S.round;return}prooms[p.id]?.emit("priv",{round:S.round,role:r})}
async function joinPriv(id){if(id===me.id||prooms[id])return;try{prooms[id]=await R.join("bw-"+S.code.toLowerCase()+"-"+id)}catch{}}
const who=r=>S.players.find(p=>S.roles[p.id]===r);
function startRound(){S.round++;S.roles={};myRole=null;S.cardRoles=shuf(Object.keys(PT));S.cards=[null,null,null,null];S.guess=null;S.delta={};S.settled=false;S.nextAt=0;S.phase="SHUFFLING";bcast();const r=S.round;
 setTimeout(()=>{if(S.round===r&&S.phase==="SHUFFLING"){S.phase="CARD_SELECTION";bcast()}},2800)}
function act(pid,d){const r=S.round;let e=null;
 if(d.type==="start"){if(pid!==S.hostId||S.phase!=="LOBBY"||S.players.length!==4)e="Poore 4 players chahiye.";else startRound()}
 else if(d.round!==r&&d.type!=="rematch")e="Purani baazi ka event.";
 else if(d.type==="pick"){const i=d.idx;if(S.phase!=="CARD_SELECTION")e="Abhi parchi nahi utha sakte.";else if(!(i>=0&&i<4&&Number.isInteger(i)))e="Ghalat parchi.";else if(S.cards[i])e="Parchi pehle hi uth chuki hai.";else if(S.cards.includes(pid))e="Aap parchi utha chuke hain.";
  else{S.cards[i]=pid;S.roles[pid]=S.cardRoles[i];if(S.cards.every(Boolean)){S.phase="BADSHAH_DIALOGUE";setTimeout(()=>{if(S.round===r&&S.phase==="BADSHAH_DIALOGUE"){S.phase="WAZEER_RESPONSE";bcast()}},2500)}bcast()}}
 else if(d.type==="resp"){if(S.phase!=="WAZEER_RESPONSE"||who("WAZEER")?.id!==pid)e="Sirf Wazeer jawab de sakta hai.";else{S.phase="CHOR_GUESS";bcast()}}
 else if(d.type==="guess"){const s=S.roles[d.sus];if(S.phase!=="CHOR_GUESS"||S.guess||who("WAZEER")?.id!==pid)e="Abhi guess nahi kar sakte.";else if(s!=="SIPAHI"&&s!=="CHOR")e="Ghalat shak.";else{S.guess={sus:d.sus,ok:s==="CHOR"};settle()}}
 else if(d.type==="rematch"){if(S.phase!=="GAME_OVER")e="Match abhi khatam nahi hua.";else{S.players.forEach(p=>p.score=0);S.round=0;S.winners=[];startRound()}}
 if(e){if(pid===me.id)showErr(e);else prooms[pid]?.emit("priv",{err:e})}}
function settle(){if(S.settled)return;S.settled=true;const ok=S.guess.ok;
 S.players.forEach(p=>{const r=S.roles[p.id];const pts=r==="WAZEER"?(ok?500:0):r==="CHOR"?(ok?0:500):PT[r];S.delta[p.id]=pts;p.score+=pts});
 const top=Math.max(...S.players.map(p=>p.score));
 if(top>=5000){S.phase="GAME_OVER";S.winners=S.players.filter(p=>p.score===top).map(p=>p.id)}
 else{S.phase="ROUND_RESULTS";S.nextAt=Date.now()+6000;const r=S.round;setTimeout(()=>{if(S.round===r&&S.phase==="ROUND_RESULTS")startRound()},6000)}bcast()}
function onHello(m){const d=m.data||{},id=clean(d.id,8),name=clean(d.name,14);if(!id||!name)return;let p=S.players.find(x=>x.id===id);
 if(!p){if(S.phase!=="LOBBY"||S.players.length>=4)return;p={id,name,av:clean(d.av,4)||"🦁",score:0};S.players.push(p);joinPriv(id)}else joinPriv(id);p.seen=Date.now();bcast()}

/* ---------- connection ---------- */
async function connect(code,host){
 R=await claude.use("room");if(!R)return showErr("Multiplayer sirf claude.ai ke andar (shared Artifact) mein chalta hai.");
 isHost=host;const base="bw-"+code.toLowerCase();
 try{room=await R.join(base);const mine=await R.join(base+"-"+me.id);
  mine.on("priv",m=>{const d=m.data||{};if(d.err)showErr(String(d.err).slice(0,80));if(d.role&&PT[d.role]){myRole=d.role;myRR=d.round;draw()}})}
 catch(e){return showErr("Room join nahi ho saka: "+(e.message||e.code))}
 room.on("reaction",m=>{const d=m.data||{},id=clean(d.id,8),t=clean(d.text,30);if(!id||!t)return;rx[id]=t;draw();beep(660,.1);setTimeout(()=>{delete rx[id];draw()},2500)});
 if(host){S=newS(code);S.players.push({id:me.id,name:me.name,av:me.av,score:0,seen:Date.now()});
  room.on("hello",onHello);room.on("act",m=>{const d=m.data||{};if(d&&typeof d.id==="string"&&S.players.some(p=>p.id===d.id))act(d.id,d)});
  bcast();setInterval(bcast,2500)}
 else{room.on("state",m=>{if(m.data&&m.data.code){pub=m.data;draw()}});const hi=()=>room.emit("hello",{id:me.id,name:me.name,av:me.av});hi();setInterval(hi,3000);
  setTimeout(()=>{if(!pub||!pub.players.some(p=>p.id===me.id))showErr("Room nahi mila, full hai, ya khel shuru ho chuka hai.")},7000)}
}
const send=(type,x={})=>{if(isHost)act(me.id,{type,round:pub.round,...x});else room.emit("act",{id:me.id,type,round:pub.round,...x}).catch(()=>{})};

/* ---------- UI ---------- */
function draw(){
 if(!pub){const ph=F.mode;app.innerHTML=`<div class="w"><h1>Badshah Wazeer Sipahi Chor</h1><p>Badshahat ka faisla, Wazeer ki aqal aur Chor ki qismat!</p>`+
  (!ph?`<div class="row"><button class="b" data-a="mode:create">Create Room</button><button class="b a" data-a="mode:join">Join Room</button></div>`:
  `<div class="k"><input id="nm" placeholder="Nickname" maxlength="14" value="${esc(me.name)}"><div class="row">${AV.map(a=>`<button class="av ${a===me.av?"s":""}" data-a="av:${a}">${a}</button>`).join("")}</div>${ph==="join"?`<input id="cd" placeholder="Room code" maxlength="6" value="${esc(F.code)}">`:""}<button class="b" data-a="go">${ph==="create"?"Banao!":"Shamil ho jao!"}</button><button class="l" data-a="mode:">Back</button></div>`)+
  (err?`<div class="e">${esc(err)}</div>`:"")+`</div>`;return}
 const P=pub.players,m=P.find(p=>p.id===me.id);if(!m){app.innerHTML=`<div class="w"><h2>Room join ho raha hai…</h2>${err?`<div class="e">${esc(err)}</div>`:""}</div>`;return}
 if(pub.phase!==lastPh){lastPh=pub.phase;pend=null;beep({SHUFFLING:300,CARD_SELECTION:500,ROUND_RESULTS:800,GAME_OVER:1000}[pub.phase]||400,.25)}
 const role=m.role||(myRR===pub.round?myRole:null),meW=role==="WAZEER",sorted=[...P].sort((a,b)=>b.score-a.score);
 if(pub.phase==="LOBBY"){app.innerHTML=`<div class="w"><h1>Royal Lobby</h1><div class="code">${esc(pub.code)}</div><button class="b a" data-a="copy">Copy Room Code</button>
  <div class="lob">${[0,1,2,3].map(i=>{const p=P[i];return p?`<div class="st"><div class="f">${esc(p.av)}</div><b>${esc(p.name)}</b>${p.id===pub.hostId?"<small>👑 host</small>":""}</div>`:`<div class="st em"><small>Waiting for Player...</small></div>`}).join("")}</div>
  <p>Bas 4 players poore hone dein! (${P.length}/4)</p>${pub.hostId===me.id?`<button class="b" data-a="start" ${P.length!==4?"disabled":""}>Start Royal Game</button>`:"<p>Host khel shuru karega…</p>"}${err?`<div class="e">${esc(err)}</div>`:""}</div>`;return}
 const sp={SHUFFLING:"Shuffling... Dekhte hain aaj Badshah kon banta hai!",CARD_SELECTION:m.picked?"Baaki players ki parchi ka intezar hai!":"Apni qismat ki parchi uthao!",BADSHAH_DIALOGUE:"Badshah ka Wazeer kon?",WAZEER_RESPONSE:meW?"Wazeer Sahab, ab aap ki baari!":"Badshah ka farman aa raha hai!",CHOR_GUESS:"Wazeer! Batao in dono mein Chor kon hai?",ROUND_RESULTS:pub.result?.ok?"WAH WAZEER WAH! Chor pakra gaya!":"HAAYE WAZEER! Asli Chor bach nikla!",GAME_OVER:""}[pub.phase];
 const wz=P.find(p=>p.role==="WAZEER"),sus=P.filter(p=>p.role!=="BADSHAH"&&p.role!=="WAZEER"),inRound=!["ROUND_RESULTS","GAME_OVER","SHUFFLING"].includes(pub.phase);
 app.innerHTML=`<div class="g"><header><b>Round ${pub.round}</b><span>Room ${esc(pub.code)}</span><span>Target: 5000</span><span><button class="l" data-a="mute">${mute?"🔇":"🔊"}</button><button class="l lbt" data-a="lb">🏆</button></span></header>
 <section class="bd">${P.map((p,i)=>`<div class="st s${i} ${p.id===me.id?"me":""} ${p.on?"":"off"} ${p.role==="BADSHAH"&&pub.phase==="BADSHAH_DIALOGUE"?"gl":""}">${p.role==="BADSHAH"?'<div class="cr">👑</div>':""}${rx[p.id]?`<div class="rx">${esc(rx[p.id])}</div>`:""}<div class="f">${esc(p.av)}</div><b>${esc(p.name)}${p.id===me.id?" (aap)":""}</b><small>${p.on?"🟢":"🔴 disconnected"} ${p.score} pts</small><small>${p.role?IC[p.role]+" "+p.role:p.picked?"🂠 parchi utha li":""}</small></div>`).join("")}
 <div class="m"><div class="sp">${sp}</div><div class="cs ${pub.phase==="SHUFFLING"?"sh":""}">${pub.cards.map((t,i)=>`<button class="pc ${t?"t":""}" data-a="pick:${i}" ${pub.phase!=="CARD_SELECTION"||t||m.picked?"disabled":""}>${t?"✓":"?"}</button>`).join("")}</div>
 ${role&&inRound?`<div class="rv ${role}">${IC[role]} <b>You are ${role}!</b> ${PT[role]} Points<br>${RV[role][0]} ${RV[role][1]}</div>`:""}
 ${pub.phase==="WAZEER_RESPONSE"&&meW?`<button class="b" data-a="resp">Jee Hazooor!</button>`:""}
 ${pub.phase==="CHOR_GUESS"&&wz?`<div class="sp">${esc(wz.name)}: “Jee Hazooor! Jee Hazooor!”</div>`:""}
 ${pub.phase==="CHOR_GUESS"&&meW?(pend?`<div class="k"><p>Kya aap ko yaqeen hai ke yehi Chor hai?</p><button class="b" data-a="yes">Haan, yehi Chor hai!</button><button class="b a" data-a="no">Nahi, dobara sochna hai</button></div>`:`<div class="row">${sus.map(s=>`<button class="su" data-a="sus:${s.id}">${esc(s.av)}<br>${esc(s.name)}<br>❓ Is this the Chor?</button>`).join("")}</div>`):""}
 ${pub.phase==="CHOR_GUESS"&&!meW?"<p>Wazeer Sahab soch rahe hain…</p>":""}</div></section>
 <aside class="lb ${lbo?"o":""}"><h3>ROYAL LEADERBOARD</h3>${sorted.map((p,i)=>`<div class="lr"><span>${i===0&&p.score>0?"👑":i+1+"."} ${esc(p.av)} ${esc(p.name)}</span><b>${p.score}</b><div class="br"><i style="width:${Math.min(100,p.score/50)}%"></i></div></div>`).join("")}</aside>
 <footer>${RX.map(t=>`<button class="ch" data-a="rx:${t}">${t}</button>`).join("")}</footer></div>${err?`<div class="e" style="position:fixed;bottom:70px;left:50%;transform:translateX(-50%);z-index:40">${esc(err)}</div>`:""}
 ${pub.result?`<div class="ov"><div class="k big">${pub.phase==="GAME_OVER"?`<h1>BADSHAHAT KA ASLI CHAMPION! 🎉</h1><h2>${pub.winners.map(id=>esc(P.find(p=>p.id===id).name)).join(" & ")} ${pub.winners.length>1?"Win!":"Wins!"}</h2>`:`<h2>Round ${pub.round} Complete!</h2><p>${pub.result.ok?"Chor pakra gaya! Badshah khush hua!":"Bechara Sipahi phans gaya!"}</p>`}
 <table><tr><th>Player</th><th>Role</th><th>Round</th><th>Total</th></tr>${sorted.map(p=>`<tr><td>${esc(p.av)} ${esc(p.name)}</td><td>${IC[p.role]||""} ${p.role||""}</td><td>+${pub.result.d[p.id]}</td><td>${p.score}</td></tr>`).join("")}</table>
 ${pub.phase==="ROUND_RESULTS"?`<p>Agli baazi ke liye tayyar ho jao! <b id="cd2"></b></p>`:`<div class="row"><button class="b" data-a="rematch">Play Again</button><button class="b a" data-a="copyres">Copy Final Results</button></div>`}</div></div>`:""}`}
setInterval(()=>{const e=$("#cd2");if(e&&pub)e.textContent=Math.max(0,Math.ceil((pub.nextAt-Date.now())/1000))+"s"},300);
document.addEventListener("input",e=>{if(e.target.id==="nm")me.name=e.target.value;if(e.target.id==="cd")F.code=e.target.value.toUpperCase()});
document.addEventListener("click",e=>{const b=e.target.closest("[data-a]");if(!b)return;const[a,...r]=b.dataset.a.split(":"),v=r.join(":");
 if(a==="mode"){F.mode=v;draw()}else if(a==="av"){me.name=$("#nm")?.value||me.name;me.av=v;draw()}
 else if(a==="go"){me.name=clean($("#nm").value,14);if(!me.name)return showErr("Nickname likho.");if(F.mode==="create"){const A="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";connect(Array.from({length:6},()=>A[rnd(A.length)]).join(""),true)}else{F.code=clean($("#cd").value,6).toUpperCase();if(F.code.length<6)return showErr("6-character room code likho.");connect(F.code,false)}}
 else if(a==="copy")navigator.clipboard?.writeText(pub.code);else if(a==="start")send("start");else if(a==="pick"){send("pick",{idx:+v});beep(520,.1)}
 else if(a==="resp")send("resp");else if(a==="sus"){pend=v;draw()}else if(a==="no"){pend=null;draw()}else if(a==="yes"){send("guess",{sus:pend});pend=null}
 else if(a==="rx"){const d={id:me.id,text:v};room.emit("reaction",d).catch(()=>{})}else if(a==="mute"){mute=!mute;draw()}else if(a==="lb"){lbo=!lbo;draw()}
 else if(a==="rematch")send("rematch");else if(a==="copyres")navigator.clipboard?.writeText([...pub.players].sort((x,y)=>y.score-x.score).map((p,i)=>`${i+1}. ${p.name} - ${p.score}`).join("\n"))});
